# tmux example config
# 目标:
# 1. 能直接上下滚动历史
# 2. 复制模式接近 vim 手感
# 3. 底部状态栏比默认更清爽
# 4. 不依赖插件, 开箱即用

##### Terminal / colors ######################################################

# 告诉 tmux 终端能力, 避免颜色显示异常.
set -g default-terminal "tmux-256color"

# 对常见终端补充 truecolor 支持.
set -ga terminal-overrides ",xterm-256color:Tc"

##### Scrolling / copy mode ##################################################

# 开启鼠标支持:
# - 可以直接滚轮上下翻历史
# - 可以点击切 pane / window
# - 在复制模式里也能用鼠标选择
set -g mouse on

# 把历史缓冲调大一点, 免得日志刷没了.
set -g history-limit 50000

# 复制模式使用 vim 风格按键.
setw -g mode-keys vi

# 进入复制模式后:
# - v 开始选择
# - y 复制并退出
# - Escape 取消
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# macOS 下把选中内容直接送进系统剪贴板.
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "pbcopy"

##### Window / pane behavior #################################################

# 窗口和 pane 从 1 开始编号, 更符合直觉.
set -g base-index 1
setw -g pane-base-index 1

# 关闭某个 window 后自动重排编号.
set -g renumber-windows on

# 最后一个 window 被关掉时不要直接把 session 踢掉.
set -g detach-on-destroy off

##### Status bar #############################################################

# 状态栏放在底部.
set -g status-position bottom

# 每 5 秒刷新一次右侧时间等信息.
set -g status-interval 5

# window 列表靠左排列.
set -g status-justify left

# 整体配色:
# - 深色底
# - 淡色字
set -g status-style "bg=#1f2335,fg=#c0caf5"

# 命令提示和复制模式高亮用更亮的颜色, 方便区分状态.
set -g message-style "bg=#7aa2f7,fg=#1f2335"
set -g mode-style "bg=#bb9af7,fg=#1f2335"

# 预留左右内容长度, 避免信息被截断得太快.
set -g status-left-length 80
set -g status-right-length 80

# 左边显示 session 名.
set -g status-left '#[fg=#1f2335,bg=#7aa2f7,bold] #S  #[fg=#7aa2f7,bg=#24283b]#[fg=#c0caf5,bg=#24283b] #{=|30|...:#{b:pane_current_path}}   #[default]'

# 普通 window 样式.
set -g window-status-format "#[fg=#7aa2f7] #I:#W "

# 当前 window 更亮, 一眼能看出来.
set -g window-status-current-format "#[fg=#1f2335,bg=#9ece6a,bold] #I:#W #[default]"

# 右边显示主机名、日期、时间.
set -g status-right "#[fg=#bb9af7]#h #[fg=#565f89]| #[fg=#e0af68]%Z #[fg=#7dcfff]%Y-%m-%d #[fg=#e0af68]%H:%M "
##### Handy binds ############################################################

# 分屏时继承当前 pane 的工作目录.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 快速重载配置.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### Notes ##################################################################

# 常用操作:
# - Ctrl-a [   进入滚动 / 复制模式
# - 滚轮        直接翻历史
# - Ctrl-a |   左右分屏
# - Ctrl-a -   上下分屏
# - Ctrl-a r   重载配置

